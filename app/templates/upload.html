<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>bandcopy ドラムエディタ</title>
  <base href="{{ base }}">
</head>
<body>
  <h1>ドラムエディタ</h1>
  {% if base != '/' %}<p><a href="../">みんな用に戻る</a></p>{% endif %}
  <p>動画URLを貼るか、音源をアップロードすると、ドラムを分離してグリッド編集を開始します。</p>
  <form id="load-form">
    <p>
      <label for="audio-url">動画URL（YouTube等）</label><br>
      <input type="url" id="audio-url" size="52"
             placeholder="https://www.youtube.com/watch?v=... を貼り付け">
    </p>
    <p>
      <label for="audio-file">または音源ファイル</label><br>
      <input type="file" id="audio-file" accept="audio/*">
    </p>
    <button type="submit">開始</button>
  </form>
  <p id="load-msg"></p>
  <script>
    document.getElementById("load-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("load-msg");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const file = document.getElementById("audio-file").files[0];
      const url = document.getElementById("audio-url").value.trim();
      if (!url && !file) {
        msg.textContent = "! 動画URLを貼るか、音源ファイルを選んでください";
        return;
      }
      const fd = new FormData();
      // URLが入っていればURL優先（サーバ側の /load と同じ決め打ち）
      if (url) fd.append("url", url);
      else fd.append("audio", file);
      msg.textContent = url
        ? "取り込み中…（ダウンロード＋ドラム分離で数分かかることがあります）"
        : "解析中…（ドラム分離は数分かかることがあります）";
      submitBtn.disabled = true;
      try {
        const res = await fetch("load", { method: "POST", body: fd });
        if (res.ok) {
          location.reload();
        } else {
          const data = await res.json().catch(() => ({}));
          msg.textContent = "! " + (data.error || res.status);
          submitBtn.disabled = false;
        }
      } catch (err) {
        msg.textContent = "! 通信に失敗しました";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
